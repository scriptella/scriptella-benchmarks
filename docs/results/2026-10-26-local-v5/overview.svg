 <title id="chart-title">End-to-end CSV import times — benchmark v5</title><desc id="chart-desc">One million rows; median of 2 local runs; Scriptella 1.6. PostgreSQL: Scriptella · batch 1000 10.053 seconds, JDBC · batch 1000 7.579 seconds, Pandas + SQLAlchemy · write 1000 29.106 seconds, COPY native reference 2.366 seconds. MariaDB: Scriptella · batch 1000 9.227 seconds, JDBC · batch 1000 5.622 seconds, Pandas + SQLAlchemy · write 1000 19.609 seconds, LOAD DATA LOCAL native reference 3.039 seconds. Linear axis starts at zero. Lower is faster; bars are medians, dots are individual measurements. Native loaders are separate references.</desc><metadata>
