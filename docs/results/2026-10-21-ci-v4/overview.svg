 <title id="chart-title">End-to-end CSV import times — benchmark v4</title><desc id="chart-desc">One million rows, one GitHub Actions run. PostgreSQL: Scriptella · batch 1000 7.775 seconds, JDBC · batch 1000 6.320 seconds, csvsql · chunk 1000 378.555 seconds, COPY · native reference 1.401 seconds. MariaDB: Scriptella · batch 1000 6.694 seconds, JDBC · batch 1000 4.465 seconds, csvsql · chunk 1000 370.594 seconds. Logarithmic duration scale; lower is faster. Chunking and JDBC batching differ.</desc><metadata>
