name: CSV import benchmark

on:
  workflow_dispatch:
    inputs:
      scriptella_version:
        description: Maven-published Scriptella release
        required: true
        default: '1.6'
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCRIPTELLA_VERSION: ${{ inputs.scriptella_version }}
      BENCHMARK_REVISION: ${{ github.sha }}
      ENVIRONMENT_ID: gha-ubuntu-24.04-x64
      ENVIRONMENT_DESCRIPTION: GitHub-hosted Ubuntu 24.04 x86_64 runner; Docker Compose; JVM defaults
    steps:
      - name: Check out benchmark
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release input
        shell: bash
        run: |
          [[ "$SCRIPTELLA_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo 'Use a numeric Maven-published release, for example 1.6.' >&2
            exit 1
          }
      - name: Run full comparison
        shell: bash
        run: |
          mkdir -p results
          docker compose up --build --abort-on-container-exit --exit-code-from benchmark 2>&1 | tee results/compose.log
      - name: Generate single-run report
        run: docker compose run --no-deps --rm benchmark aggregate /results
      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
      - name: Clean up Compose stack
        if: always()
        run: docker compose down --volumes
